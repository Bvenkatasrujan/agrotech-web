<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dynamic Circular Border with Gradient -->
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="white" stroke="url(#circleGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="84" stroke="#A5D6A7" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Farmer Silhouette holding a plant -->
  <g filter="url(#shadow)">
    <!-- Body and Hands as a single organic shape -->
    <path d="M60 150C60 140 65 125 75 120C80 118 85 118 90 122C95 125 105 125 110 122C115 118 120 118 125 120C135 125 140 140 140 150V160H60V150Z" fill="#1B5E20"/>
    
    <!-- Face / Head / Hat -->
    <path d="M85 95C85 88 92 82 100 82C108 82 115 88 115 95V102H85V95Z" fill="#1B5E20"/>
    <path d="M55 85H145C145 85 140 75 100 75C60 75 55 85 55 85Z" fill="#1B5E20"/>
    <path d="M82 75V70C82 64 90 62 100 62C110 62 118 64 118 70V75" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>

    <!-- The Green Crop (Held in Hands) -->
    <g transform="translate(100, 120)">
      <!-- Central Stem -->
      <path d="M0 5V-25" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Vibrant Green Leaves -->
      <!-- Bottom Left -->
      <path d="M-2 -5C-15 -10 -20 5 -5 10C5 12 5 2 -2 -5Z" fill="#4CAF50"/>
      <!-- Bottom Right -->
      <path d="M2 -5C15 -10 20 5 5 10C-5 12 -5 2 2 -5Z" fill="#4CAF50"/>
      <!-- Mid Left -->
      <path d="M-2 -15C-12 -22 -18 -8 -4 -5C2 -3 2 -10 -2 -15Z" fill="#43A047"/>
      <!-- Mid Right -->
      <path d="M2 -15C12 -22 18 -8 4 -5C-2 -3 -2 -10 2 -15Z" fill="#43A047"/>
      <!-- Top Tip -->
      <path d="M0 -25C-5 -35 5 -35 0 -25Z" stroke="#2E7D32" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 -26C-6 -38 6 -38 0 -26Z" fill="#81C784"/>
    </g>
  </g>

  <!-- Ground / Accent -->
  <path d="M50 160C50 160 75 155 100 155C125 155 150 160 150 160" stroke="#1B5E20" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
